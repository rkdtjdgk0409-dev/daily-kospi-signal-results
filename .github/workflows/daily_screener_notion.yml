name: Daily KOSPI Signal Screener + Notion Page

on:
  workflow_dispatch:
    inputs:
      top_n:
        description: "Current KOSPI market-cap top N"
        required: true
        default: "200"
      cci_period:
        description: "CCI period"
        required: true
        default: "9"
      dmi_period:
        description: "DMI/ADX period"
        required: true
        default: "14"
      adx_threshold:
        description: "Minimum ADX"
        required: true
        default: "20"

  schedule:
    # 07:40 UTC = 16:40 KST
    - cron: "40 7 * * 1-5"

jobs:
  screen-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener (scheduled defaults)
        if: github.event_name == 'schedule'
        run: |
          python scanner.py \
            --top-n 200 \
            --cci-period 9 \
            --dmi-period 14 \
            --adx-threshold 20

      - name: Run screener (manual inputs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scanner.py \
            --top-n "${{ inputs.top_n }}" \
            --cci-period "${{ inputs.cci_period }}" \
            --dmi-period "${{ inputs.dmi_period }}" \
            --adx-threshold "${{ inputs.adx_threshold }}"

      - name: Update Notion page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python notion_publish.py

      - name: Upload result files
        uses: actions/upload-artifact@v4
        with:
          name: daily-kospi-signal-results
          path: results/
          retention-days: 30
