name: Daily Korea Alpha Screener + GitHub Pages

on:
  workflow_dispatch:
    inputs:
      kospi_n:
        description: "Current KOSPI market-cap top N"
        required: true
        default: "200"
      kosdaq_n:
        description: "Current KOSDAQ market-cap top N"
        required: true
        default: "150"
      kospi_min_avg20_value:
        description: "KOSPI min 20-day avg trading value (KRW, 0 = disabled)"
        required: true
        default: "0"
      kosdaq_min_avg20_value:
        description: "KOSDAQ min 20-day avg trading value (KRW)"
        required: true
        default: "3000000000"
      cci_period:
        description: "CCI period"
        required: true
        default: "9"
      dmi_period:
        description: "DMI/ADX period"
        required: true
        default: "14"
      adx_threshold:
        description: "Minimum ADX for fresh-buy filter"
        required: true
        default: "20"
      buy_alpha_threshold:
        description: "Minimum Alpha score for fresh-buy filter"
        required: true
        default: "70"

  schedule:
    # 16:40 KST, Monday-Friday (07:40 UTC)
    - cron: "40 7 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener scheduled
        if: github.event_name == 'schedule'
        run: >-
          python scanner.py
          --kospi-n 200
          --kosdaq-n 150
          --kospi-min-avg20-value 0
          --kosdaq-min-avg20-value 3000000000
          --cci-period 9
          --dmi-period 14
          --adx-threshold 20
          --buy-alpha-threshold 70

      - name: Run screener manual
        if: github.event_name == 'workflow_dispatch'
        run: >-
          python scanner.py
          --kospi-n "${{ inputs.kospi_n }}"
          --kosdaq-n "${{ inputs.kosdaq_n }}"
          --kospi-min-avg20-value "${{ inputs.kospi_min_avg20_value }}"
          --kosdaq-min-avg20-value "${{ inputs.kosdaq_min_avg20_value }}"
          --cci-period "${{ inputs.cci_period }}"
          --dmi-period "${{ inputs.dmi_period }}"
          --adx-threshold "${{ inputs.adx_threshold }}"
          --buy-alpha-threshold "${{ inputs.buy_alpha_threshold }}"

      - name: Build HTML page
        run: python build_page.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: daily-korea-alpha-screener-results
          path: results/
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
