name: Daily KOSPI Signal Screener
on:
  workflow_dispatch:
    inputs:
      top_n:
        description: "Current KOSPI market-cap top N"
        required: true
        default: "200"
      cci_period:
        description: "CCI period"
        required: true
        default: "9"
      dmi_period:
        description: "DMI/ADX period"
        required: true
        default: "14"
      adx_threshold:
        description: "Minimum ADX"
        required: true
        default: "20"
  schedule:
    - cron: "40 7 * * 1-5"  # 16:40 KST weekdays
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run scheduled screener
        if: github.event_name == 'schedule'
        run: python scanner.py --top-n 200 --cci-period 9 --dmi-period 14 --adx-threshold 20
      - name: Run manual screener
        if: github.event_name == 'workflow_dispatch'
        run: python scanner.py --top-n "${{ inputs.top_n }}" --cci-period "${{ inputs.cci_period }}" --dmi-period "${{ inputs.dmi_period }}" --adx-threshold "${{ inputs.adx_threshold }}"
      - uses: actions/upload-artifact@v4
        with:
          name: daily-kospi-signal-results
          path: results/
          retention-days: 30
